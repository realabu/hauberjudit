<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Judit — két változat összehasonlítása</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5efe7;color:#451b2c;font:16px system-ui}header{padding:22px 28px}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0}button,a{color:inherit}button{border:1px solid #451b2c;border-radius:30px;padding:10px 18px;background:white;cursor:pointer}button[aria-pressed=true]{background:#451b2c;color:white}.frames{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:10px 20px 30px;flex-wrap:wrap}section{width:390px;max-width:100%}h2{font-size:18px}iframe{display:block;width:100%;height:780px;border:1px solid #d7c9c7;border-radius:16px;background:white}.desktop section{width:100%;max-width:1280px}.desktop iframe{height:950px}a{margin-left:12px}@media(max-width:440px){header{padding:20px}.frames{padding:10px}}
</style><header><h1>Két változat, egy Judit</h1><p>Az eredeti és az új oldal külön görgethető. Mobilnézetben mindkét oldal 390 pixel széles.</p><button id="mobile" aria-pressed="true">Mobilnézet</button> <button id="desktop" aria-pressed="false">Széles nézet</button></header><main class="frames" id="frames"><section><h2>Eredeti oldal <a href="../" target="_blank" rel="noopener">Megnyitás ↗</a></h2><iframe src="../" title="Eredeti" loading="eager"></iframe></section><section><h2>Új v2 <a href="./" target="_blank" rel="noopener">Megnyitás ↗</a></h2><iframe src="./" title="V2" loading="eager"></iframe></section></main><script>
for(const id of ['mobile','desktop'])document.getElementById(id).onclick=()=>{document.getElementById('frames').classList.toggle('desktop',id==='desktop');for(const key of ['mobile','desktop'])document.getElementById(key).setAttribute('aria-pressed',String(key===id));};
</script></html>
